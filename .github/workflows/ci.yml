name: P0 App Gates

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-app-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-gates:
    name: Typecheck, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install pinned npm
        run: npm install --global npm@11.6.0

      - name: Verify toolchain
        run: |
          node --version
          npm --version

      - name: Install dependencies
        id: dependencies
        run: npm ci --no-audit --no-fund

      - name: Reject known runtime dependency vulnerabilities
        run: npm run audit:runtime

      - name: Typecheck
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run typecheck

      - name: Typecheck isolated field photo worker
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npx tsc --project tsconfig.field-photos.json --noEmit

      - name: Bundle isolated field photo worker
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npx esbuild workers/field-photos/index.ts --bundle --format=esm --platform=neutral --main-fields=module,main --conditions=workerd,worker,browser --external:node:* --tsconfig=tsconfig.field-photos.json --outfile=tmp/field-photo-worker/index.js

      - name: Decode a synthetic image through the local Images binding
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node scripts/test-field-photo-images.mjs

      - name: Lint
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run lint

      - name: Verify calculation sources
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run verify:faktorer

      - name: Test serially
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        env:
          VITE_SUPABASE_URL: ""
          VITE_SUPABASE_PUBLISHABLE_KEY: ""
          VITE_SUPABASE_ANON_KEY: ""
        run: npm test -- --maxWorkers=1 --no-file-parallelism

      - name: Build
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run build

  database-gates:
    name: Fresh local migrations and isolation tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Setup Node for database lint classification
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Start disposable local stack
        run: supabase start --exclude studio,imgproxy,edge-runtime,logflare,vector,supavisor

      - name: Match PostgreSQL client tools to the disposable server
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          pgdg_fingerprint=$(gpg --batch --with-colons --show-keys --fingerprint /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc | awk -F: '$1 == "fpr" {print $10; exit}')
          test "$pgdg_fingerprint" = B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Replay migrations from empty local database
        run: |
          supabase db reset --local --no-seed --version 20261124022247
          node scripts/test-postgis-schema-upgrade.mjs --disposable-local
          supabase db reset --local --no-seed

      - name: Check database isolation
        run: supabase test db --local supabase/tests/database

      - name: Check real local database concurrency
        run: |
          set -euo pipefail
          node scripts/test-disposable-db-concurrency.mjs \
            --disposable-local \
            --database postgresql://postgres:postgres@127.0.0.1:54322/postgres \
            --checkout-sha '${{ github.sha }}'
          node scripts/database-concurrency/field-job-concurrency.test.mjs \
            --disposable-local \
            --database postgresql://postgres:postgres@127.0.0.1:54322/postgres
          node scripts/database-concurrency/field-photo-concurrency.test.mjs \
            --disposable-local \
            --database postgresql://postgres:postgres@127.0.0.1:54322/postgres
          mkdir -p tmp/database-concurrency
          node scripts/database-concurrency/work-order-observation-drafts.test.mjs \
            --disposable-local \
            --database postgresql://postgres:postgres@127.0.0.1:54322/postgres \
            | tee tmp/database-concurrency/work-order-observation-drafts.json

      - name: Restore a real database dump to a disposable database
        env:
          CI: "true"
        run: bash scripts/test-release-restore.sh

      - name: Check database functions
        run: supabase db lint --local --schema public,private,storage --level error --fail-on error

      - name: Install pinned npm for browser acceptance
        run: npm install --global npm@11.6.0

      - name: Install browser acceptance dependencies
        run: npm ci --no-audit --no-fund

      - name: Check migrated public API types
        run: |
          mkdir -p tmp/postgis-upgrade
          supabase gen types typescript --local --schema public > tmp/postgis-upgrade/public-schema.ts
          node scripts/check-postgis-api-types.mjs src/integrations/supabase/types.ts tmp/postgis-upgrade/public-schema.ts

      - name: Install Chromium for disposable browser acceptance
        run: npx playwright install --with-deps chromium

      - name: Test planning and documented field workflow in the disposable local stack
        env:
          CI: "true"
        run: node scripts/test-local-planning-browser.mjs --disposable-local

      - name: Stop disposable local stack and retain cleanup evidence
        if: always()
        run: node scripts/database-concurrency/stop-disposable-stack.mjs --disposable-local

      # Generated receipts and logs stay in the ignored directories on this
      # disposable runner. This public repository must not publish test files.
