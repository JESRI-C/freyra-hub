name: P0 App Gates

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-app-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-gates:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify toolchain
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Verify calculation sources
        run: npm run verify:faktorer

      - name: Test serially
        run: npm test -- --maxWorkers=1 --no-file-parallelism

      - name: Build
        run: npm run build

  database-gates:
    name: Fresh local migrations and isolation tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Start disposable local stack
        run: supabase start --exclude studio,imgproxy,edge-runtime,logflare,vector,supavisor

      - name: Replay migrations from empty local database
        run: supabase db reset --local --no-seed

      - name: Check database isolation
        run: supabase test db --local supabase/tests/database

      - name: Check database functions
        run: supabase db lint --local --schema public,storage --level error --fail-on error

      - name: Stop disposable local stack
        if: always()
        run: supabase stop --no-backup
